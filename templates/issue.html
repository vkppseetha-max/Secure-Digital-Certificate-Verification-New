<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Certificate</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:linear-gradient(135deg,#101a35,#174b67);color:white;margin:0;padding:25px}
.box{max-width:500px;margin:40px auto;background:#ffffff12;padding:30px;border-radius:15px}
h1{text-align:center}
label{display:block;margin-top:18px}
input{width:100%;padding:13px;margin-top:8px;border:0;border-radius:7px}
button{width:100%;padding:14px;margin-top:22px;background:#21c7a8;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
a{color:#7debd9}
</style>
</head>
<body>
<div class="box">
<h1>Issue Certificate</h1>
<p>Enter the student's details to generate a secure certificate.</p>

<form method="POST" action="/issue">
<label>Student Name</label>
<input type="text" name="student_name" placeholder="Enter student name" required>

<label>Course Name</label>
<input type="text" name="course" placeholder="Enter course name" required>

<button type="submit">Generate Certificate</button>
</form>

<p><a href="/">← Back to Home</a></p>
</div>
</body>
</html>
